apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-consumer
  labels:
    app: inference-consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-consumer
  template:
    metadata:
      labels:
        app: inference-consumer
    spec:
      containers:
        - name: consumer
          image: jastar556/inference-consumer:latest
          imagePullPolicy: Always
          env:
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: inference-secrets
                  key: s3_bucket
            - name: SQS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: inference-secrets
                  key: sqs_queue_url
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          envFrom:
            - secretRef:
                name: aws-credentials
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
